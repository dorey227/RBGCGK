<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>TurfTrack — Greenkeeper's Companion</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --green:#1b5e20; --green2:#2e7d32; --lime:#7cb342;
    --bg:#f2f6f2; --card:#ffffff; --text:#1b2a1d; --muted:#6c7d70;
    --line:#dde7de; --amber:#ef6c00; --red:#c62828; --blue:#1565c0;
    --radius:14px;
    --shadow:0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:78px; font-size:15px; line-height:1.45;
  }
  header{
    background:linear-gradient(135deg,var(--green) 0%,var(--green2) 100%);
    color:#fff; padding:14px 16px 16px; position:sticky; top:0; z-index:50;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
  .brand .logo{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:15px}
  .head-sub{font-size:12px;opacity:.85;margin-top:2px;padding-left:37px}
  .icon-btn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600}
  .icon-btn:active{background:rgba(255,255,255,.3)}

  main{padding:14px;max-width:820px;margin:0 auto}
  .hidden{display:none !important}

  .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
  .card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
  .sec-head h2{margin:0;font-size:19px}
  .add-btn{background:var(--green);color:#fff;border:0;border-radius:10px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(27,94,32,.3)}
  .add-btn:active{transform:scale(.94)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;color:var(--green);line-height:1.1;word-break:break-word}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0;padding-bottom:0}
  .tick{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid #c3d3c5;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px;transition:.15s}
  .tick.on{background:var(--green);border-color:var(--green)}
  .item-body{flex:1;min-width:0}
  .item-title{font-weight:600;font-size:14.5px;word-wrap:break-word}
  .item-title.done{text-decoration:line-through;color:var(--muted);font-weight:500}
  .item-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
  .item-note{font-size:13px;color:#40513f;margin-top:5px;white-space:pre-wrap;word-wrap:break-word}
  .del{background:none;border:0;color:#b9c7bb;font-size:17px;cursor:pointer;padding:0 4px;line-height:1;flex:0 0 auto}
  .del:active{color:var(--red)}

  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .p-high{background:#fdecea;color:var(--red)}
  .p-med{background:#fff3e0;color:var(--amber)}
  .p-low{background:#e8f5e9;color:var(--green2)}
  .p-area{background:#eef3ee;color:#4a5c4c}
  .p-type{background:#e3f2fd;color:var(--blue)}
  .p-overdue{background:#fdecea;color:var(--red)}

  .empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:13.5px}
  .empty .big{font-size:28px;display:block;margin-bottom:6px;opacity:.5}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head h2{margin:0;font-size:17px;text-transform:capitalize}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{background:#eef3ee;border:0;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--green);font-weight:700}
  .cal-nav button:active{background:#dbe7dc}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 0;letter-spacing:.4px}
  .cal-day{aspect-ratio:1/1;border-radius:9px;background:#f7faf7;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;position:relative;font-size:12.5px;overflow:hidden}
  .cal-day.blank{background:transparent;cursor:default}
  .cal-day .num{font-weight:600;font-size:12px;color:#465a48}
  .cal-day.today{background:#e8f5e9;border-color:var(--lime)}
  .cal-day.today .num{color:var(--green);font-weight:800}
  .cal-day.sel{border-color:var(--green);background:#dcedd8}
  .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:3px}
  .dot{width:5px;height:5px;border-radius:50%}
  .d-agronomy{background:var(--green2)}
  .d-club{background:#8e24aa}
  .d-staff{background:var(--blue)}
  .d-equipment{background:var(--amber)}
  .d-chemical{background:#00838f}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

  .overlay{position:fixed;inset:0;background:rgba(15,30,18,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2}
  .sheet-head h3{margin:0;font-size:17px}
  .sheet-head button{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer}
  .sheet-body{padding:16px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
  .field{margin-bottom:13px}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fbfdfb;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green2);background:#fff;box-shadow:0 0 0 3px rgba(46,125,50,.1)}
  textarea{resize:vertical;min-height:76px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .submit{width:100%;background:var(--green);color:#fff;border:0;padding:14px;border-radius:12px;font-size:15.5px;font-weight:700;cursor:pointer;margin-top:6px}
  .submit:active{background:var(--green2)}

  details.calc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.calc summary{padding:12px 14px;font-weight:600;cursor:pointer;background:#f7faf7;font-size:14px;list-style:none}
  details.calc summary::-webkit-details-marker{display:none}
  details.calc summary::before{content:"▸ ";color:var(--green2)}
  details.calc[open] summary::before{content:"▾ "}
  .calc-body{padding:14px;border-top:1px solid var(--line)}
  .result{background:#e8f5e9;border-radius:11px;padding:12px;margin-top:12px;font-size:14px;line-height:1.7;border-left:4px solid var(--green2)}
  .result b{color:var(--green)}

  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:100;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px rgba(0,0,0,.06)}
  nav button{background:none;border:0;padding:9px 1px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#96a698;font-size:9px;font-weight:600;font-family:inherit}
  nav button .ni{font-size:17px;line-height:1}
  nav button.active{color:var(--green)}

  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#263a29;color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  #authScreen{
    position:fixed;inset:0;z-index:400;
    background:linear-gradient(160deg,#1b5e20 0%,#2e7d32 55%,#43a047 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .auth-card{background:#fff;color:var(--text);border-radius:20px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--lime));display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
  .auth-card h1{margin:0 0 4px;font-size:23px;text-align:center;color:var(--green)}
  .auth-card p.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:13.5px}
  .auth-btn{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:9px}
  .auth-btn:hover{background:#f7faf7}
  .auth-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .auth-btn.primary:hover{background:var(--green2)}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .auth-err{background:#fdecea;color:var(--red);border-radius:9px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;display:none}
  .auth-switch{text-align:center;margin-top:8px;font-size:13px;color:var(--muted)}
  .auth-switch a{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none}

  .sync-badge{font-size:10.5px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:20px;font-weight:600}

  .filter-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto;
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }

  #photoViewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    z-index: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  #photoViewer img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">⛳</div>
    <h1>RBGC GK</h1>
    <p class="sub">Greenkeeper's Companion</p>

    <div class="auth-err" id="authErr"></div>

    <button class="auth-btn primary" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1C42.7 36.1 45 30.5 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9h-7.3v5.6C8.1 41.2 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.5-1.3-.7-2.8-.7-4.3s.3-3 .7-4.3v-5.6H4.5C3 17.2 2.1 20.5 2.1 24s.9 6.8 2.4 9.9l7.3-5.6z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.5 2 8.1 6.8 4.5 14.1l7.3 5.6c1.7-5.1 6.5-9 12.2-9z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or with email</div>

    <form id="emailForm">
      <div class="field" style="margin-bottom:10px">
        <label>Email</label>
        <input type="email" id="inEmail" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>Password</label>
        <input type="password" id="inPass" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="submit" id="btnEmail">Sign In</button>
    </form>

    <div class="auth-switch">
      <span id="switchText">No account?</span>
      <a id="switchLink">Create one</a>
    </div>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="hidden">
  <header>
    <div class="head-row">
      <div>
        <div class="brand"><span class="logo">⛳</span> RBGC GK</div>
        <div class="head-sub" id="headSub">Greenkeeper's Companion</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="sync-badge" id="syncBadge">☁️ Synced</span>
        <button class="icon-btn" data-action="menu">⚙︎</button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav>
    <button data-action="nav" data-tab="dash"     class="active"><span class="ni">🏠</span>Home</button>
    <button data-action="nav" data-tab="jobs"><span class="ni">✅</span>Jobs</button>
    <button data-action="nav" data-tab="reports"><span class="ni">📋</span>Reports</button>
    <button data-action="nav" data-tab="calendar"><span class="ni">📅</span>Calendar</button>
    <button data-action="nav" data-tab="program"><span class="ni">🧪</span>Program</button>
    <button data-action="nav" data-tab="plant"><span class="ni">🌿</span>Plant</button>
    <button data-action="nav" data-tab="learn"><span class="ni">📚</span>Learn</button>
  </nav>
</div>

<div class="overlay hidden" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle">Add</h3>
      <button type="button" id="sheetClose">✕</button>
    </div>
    <form class="sheet-body" id="sheetForm"></form>
  </div>
</div>

<div id="photoViewer" class="hidden" data-action="close-photo-viewer">
  <img id="photoViewerImg" src="">
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   Firebase
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs, setDoc, deleteDoc,
  enableIndexedDbPersistence, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuyP44EvfkKz06-n90rpZ2ZJEJ2EPWFf4",
  authDomain: "rbgcgk.firebaseapp.com",
  projectId: "rbgcgk",
  storageBucket: "rbgcgk.firebasestorage.app",
  messagingSenderId: "399411735540",
  appId: "1:399411735540:web:cb0b0447ef7e3ef7b3e7a1",
  measurementId: "G-FQN0YJ85X7"
};

const fbApp = initializeApp(firebaseConfig);
const db    = getFirestore(fbApp);
const auth  = getAuth(fbApp);

setPersistence(auth, browserLocalPersistence).catch(()=>{});

enableIndexedDbPersistence(db).catch(err => {
  if(err.code === 'failed-precondition') console.warn('Offline cache: multiple tabs open');
  else if(err.code === 'unimplemented')  console.warn('Offline cache: not supported');
});

/* =========================================================
   Constants
   ========================================================= */
const PROXY_URL = 'https://rbgcgk.vercel.app/api/proxy';

const AREAS = ['Greens','Tees','Fairways','Rough','Bunkers','Practice Area',
               'Clubhouse Grounds','Irrigation','Equipment','Whole Course'];

const JOB_TYPES = ['Mowing','Aeration','Topdressing','Fertiliser','Spraying',
                   'Irrigation','Bunker Work','Landscaping','Project','Other'];

const REPORT_TYPES = ['Daily Course Report','Chemical / Fertiliser Log',
                      'Equipment Fault','Irrigation Issue','Disease / Pest Scout',
                      'Incident / Near Miss','Tournament Prep','Weekly Summary'];

const EVENT_TYPES = ['agronomy','club','staff','equipment','chemical'];

const EVENT_LABEL = {
  agronomy:'Agronomy', club:'Club Event', staff:'Staff',
  equipment:'Equipment', chemical:'Chemical'
};

const PLANT_PROMPT = `You are a turf management assistant for Australian golf courses.
You will be given a photo taken on a golf course. Identify what you see and respond ONLY
with valid JSON in this exact format:

{
  "name": "Common name",
  "botanicalName": "Botanical name or 'Unknown'",
  "category": "Weed" | "Disease" | "Pest" | "Desirable Turf" | "Unknown",
  "confidence": 0-100,
  "description": "2-3 sentences describing what you see and how you know",
  "action": "Recommended action in plain English",
  "products": "Any relevant products, rates or treatments — or 'None'",
  "safety": "Any handling or safety notes — or 'None'"
}

If you are unsure, use category "Unknown" and confidence below 50.
Never invent botanical names — say "Unknown" instead.
Respond with JSON only. No markdown, no commentary.`;

const REIDENTIFY_PROMPT = `You will be given one or more photos of the same plant, weed, disease or pest on an Australian golf course.
Provide up to 3 possible identifications, ordered from most likely to least likely.

Respond ONLY with valid JSON in this exact format:
{
  "results": [
    {
      "name": "Common name",
      "botanicalName": "Botanical name or 'Unknown'",
      "category": "Weed" | "Disease" | "Pest" | "Desirable Turf" | "Unknown",
      "confidence": 0-100,
      "description": "2-3 sentences",
      "action": "Recommended action",
      "products": "Products or 'None'",
      "safety": "Safety notes or 'None'"
    }
  ]
}

Rules:
- 1 to 3 results. If highly confident, 1 result is fine. If unsure, give multiple possibilities.
- If you cannot identify anything, return a single result with category "Unknown" and confidence below 30.
- Never invent botanical names — say "Unknown".
- Respond with JSON only. No markdown, no commentary.`;

function getDocExtractPrompt(){
  const y = new Date().getFullYear();
  return `You are a turf management assistant for Australian golf courses.
The user has provided a photo of a document — a yearly maintenance program,
renovation schedule, tournament calendar, chemical program, or similar.

Extract ALL events you can find. Respond ONLY with valid JSON:

{
  "events": [
    {
      "date": "YYYY-MM-DD",
      "title": "Short clear title",
      "type": "agronomy" | "club" | "staff" | "equipment" | "chemical",
      "notes": "Any extra detail from the document, or empty string"
    }
  ]
}

Rules:
- Current year is ${y}. If only month/day shown, use ${y}. If that date has already passed this year, use ${y+1}.
- Category mapping:
  * agronomy = aeration, coring, topdressing, overseeding, verticutting, scarifying, renovation, drainage, irrigation work, tree work
  * club = tournaments, championships, member events, charity days, social events, functions
  * staff = training, reviews, meetings, holidays, rosters
  * equipment = mower servicing, reel grinding, machinery maintenance, repairs
  * chemical = fertiliser, herbicide, fungicide, insecticide, growth regulators, sprays
- If a date is unclear, use your best guess and mention it in notes.
- If you cannot read the document, return {"events": []}.
- Respond with JSON only. No markdown. No commentary.`;
}

/* =========================================================
   State
   ========================================================= */
let state = {
  jobs:[], reports:[], events:[], learn:[], program:[], plantIds:[], plantChats:[],
  weather:'', courseStatus:'Open'
};
let activeTab = 'dash';
let calCursor = new Date();
let selectedDay = null;
let currentUser = null;
let notifyInterval = null;
let _plantPhotoData = null;
let plantFilter = 'All';

/* =========================================================
   Helpers
   ========================================================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' +
         Math.random().toString(36).slice(2,7);
}

function iso(d){
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear() + '-' +
    String(x.getMonth()+1).padStart(2,'0') + '-' +
    String(x.getDate()).padStart(2,'0');
}
const todayISO = () => iso(new Date());

function prettyDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const t = todayISO();
  if(s === t) return 'Today';
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  if(s === iso(tm)) return 'Tomorrow';
  const yd = new Date(); yd.setDate(yd.getDate()-1);
  if(s === iso(yd)) return 'Yesterday';
  return dt.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
}

function esc(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function setSyncStatus(txt, isErr){
  const b = $('#syncBadge');
  if(!b) return;
  b.textContent = txt;
  b.style.background = isErr ? 'rgba(198,40,40,.35)' : 'rgba(255,255,255,.15)';
}

/* =========================================================
   Firestore
   ========================================================= */
function userPath(){ return currentUser ? currentUser.uid : null; }

async function fsLoadAll(){
  const u = userPath();
  if(!u) return;
  const load = async (sub) => {
    const snap = await getDocs(collection(db, 'users', u, sub));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  try{
    setSyncStatus('⏳ Loading');
    const [jobs, reports, events, learn, program, plantIds, plantChats] = await Promise.all([
      load('jobs'), load('reports'), load('events'),
      load('learn'), load('program'), load('plantIds'), load('plantChats')
    ]);
    state.jobs = jobs;
    state.reports = reports;
    state.events = events;
    state.learn = learn;
    state.program = program;
    // Migrate legacy plants (thumb → photos array)
    state.plantIds = plantIds.map(p => {
      if(!p.photos || !p.photos.length){
        p.photos = p.thumb ? [p.thumb] : [];
      }
      if(!p.thumb && p.photos.length) p.thumb = p.photos[0];
      return p;
    });
    state.plantChats = plantChats;

    try{
      const sSnap = await getDocs(collection(db, 'users', u, 'settings'));
      sSnap.forEach(d => {
        const data = d.data();
        if(d.id === 'main'){
          if(data.weather !== undefined) state.weather = data.weather;
          if(data.courseStatus !== undefined) state.courseStatus = data.courseStatus;
        }
      });
    }catch(e){ /* ignore */ }

    setSyncStatus('☁️ Synced');
  }catch(e){
    console.error('Load failed', e);
    setSyncStatus('⚠️ Offline', true);
    toast('Could not load from cloud — using cache');
  }
}

async function fsSave(sub, obj){
  const u = userPath();
  if(!u) return;
  try{
    setSyncStatus('⏳ Saving');
    const { id, ...data } = obj;
    data.updatedAt = serverTimestamp();
    await setDoc(doc(db, 'users', u, sub, id), data, { merge:true });
    setSyncStatus('☁️ Synced');
  }catch(e){
    console.error('Save failed', e);
    setSyncStatus('⚠️ Offline', true);
    toast('Saved locally — will sync when online');
  }
}

async function fsDelete(sub, id){
  const u = userPath();
  if(!u) return;
  try{
    setSyncStatus('⏳ Saving');
    await deleteDoc(doc(db, 'users', u, sub, id));
    setSyncStatus('☁️ Synced');
  }catch(e){
    console.error('Delete failed', e);
    setSyncStatus('⚠️ Offline', true);
  }
}

async function fsSaveSettings(){
  const u = userPath();
  if(!u) return;
  try{
    await setDoc(doc(db, 'users', u, 'settings', 'main'), {
      weather: state.weather,
      courseStatus: state.courseStatus,
      updatedAt: serverTimestamp()
    }, { merge:true });
  }catch(e){ console.warn(e); }
}

const authScreen = $('#authScreen');
const appRoot    = $('#app');
let authMode = 'signin';

function showAuthError(msg){
  const e = $('#authErr');
  e.textContent = msg;
  e.style.display = 'block';
}
function clearAuthError(){ $('#authErr').style.display = 'none'; }

function friendlyAuthError(code){
  const map = {
    'auth/invalid-email':'That email address looks invalid.',
    'auth/user-not-found':'No account with that email. Try creating one.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/email-already-in-use':'That email is already registered.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/unauthorized-domain':'This domain is not authorised in Firebase. Add it under Authentication → Settings → Authorized domains.',
    'auth/popup-blocked':'Popup was blocked. Allow popups for this site.',
    'auth/popup-closed-by-user':'Sign-in cancelled.',
    'auth/configuration-not-found':'Sign-in method not enabled. Enable Google and Email/Password in Firebase Console → Authentication → Sign-in method.'
  };
  return map[code] || ('Sign-in failed: ' + code);
}

$('#switchLink').addEventListener('click', () => {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  clearAuthError();
  if(authMode === 'signin'){
    $('#switchText').textContent = 'No account?';
    $('#switchLink').textContent = 'Create one';
    $('#btnEmail').textContent = 'Sign In';
  }else{
    $('#switchText').textContent = 'Already have an account?';
    $('#switchLink').textContent = 'Sign in';
    $('#btnEmail').textContent = 'Create Account';
  }
});

$('#btnGoogle').addEventListener('click', async () => {
  clearAuthError();
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
  }catch(e){
    showAuthError(friendlyAuthError(e.code));
  }
});

$('#emailForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  clearAuthError();
  const email = $('#inEmail').value.trim();
  const pass  = $('#inPass').value;
  try{
    if(authMode === 'signin'){
      await signInWithEmailAndPassword(auth, email, pass);
    }else{
      await createUserWithEmailAndPassword(auth, email, pass);
    }
  }catch(e){
    showAuthError(friendlyAuthError(e.code));
  }
});

/* =========================================================
   Auth state
   ========================================================= */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if(user){
    authScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    await fsLoadAll();
    if(!state.events.length && !state.jobs.length){
      state.events  = seedEvents();
      state.jobs    = seedJobs();
      state.program = seedProgram();
      await Promise.all([
        ...state.jobs.map(j => fsSave('jobs', j)),
        ...state.events.map(e => fsSave('events', e)),
        ...state.program.map(p => fsSave('program', p))
      ]);
    }
    selectedDay = todayISO();
    render();
    startNotifyLoop();
  }else{
    appRoot.classList.add('hidden');
    authScreen.classList.remove('hidden');
    state = { jobs:[], reports:[], events:[], learn:[], program:[], plantIds:[], plantChats:[],
              weather:'', courseStatus:'Open' };
    if(notifyInterval){ clearInterval(notifyInterval); notifyInterval = null; }
  }
});

/* =========================================================
   Reminders builder
   ========================================================= */
function buildReminders(){
  const today = new Date();
  const todayStr    = iso(today);
  const tomorrowStr = iso(new Date(today.getTime() + 864e5));
  const weekEndStr  = iso(new Date(today.getTime() + 6 * 864e5));

  const todayList = [], tomorrowList = [], weekList = [];

  (state.program || []).forEach(month => {
    (month.weeks || []).forEach(wk => {
      if(!wk.weekStart) return;
      const ws = wk.weekStart;
      const pending = (wk.items || []).filter(i => !i.done);
      if(!pending.length) return;
      const label = `${month.month} · Week ${wk.week}`;

      if(ws === todayStr){
        pending.forEach(i => todayList.push({
          title: `Apply ${i.product}`,
          detail: `${label} · ${i.rate}`,
          type: 'Program'
        }));
      } else if(ws === tomorrowStr){
        pending.forEach(i => tomorrowList.push({
          title: `Tomorrow: ${i.product}`,
          detail: `${label} · ${i.rate}`,
          type: 'Program'
        }));
      } else if(ws > todayStr && ws <= weekEndStr){
        pending.forEach(i => weekList.push({
          title: i.product,
          detail: `${label} · ${i.rate}`,
          type: 'Program'
        }));
      }
    });
  });

  state.jobs.filter(j => j.status !== 'done').forEach(j => {
    if(j.due === todayStr)    todayList.push({ title: j.title, detail: j.area || '', type: 'Job' });
    if(j.due === tomorrowStr) tomorrowList.push({ title: j.title, detail: j.area || '', type: 'Job' });
  });

  state.events.filter(e => !e.done).forEach(e => {
    if(e.date === todayStr)    todayList.push({ title: e.title, detail: EVENT_LABEL[e.type] || '', type: 'Event' });
    if(e.date === tomorrowStr) tomorrowList.push({ title: e.title, detail: EVENT_LABEL[e.type] || '', type: 'Event' });
    if(e.date > tomorrowStr && e.date <= weekEndStr)
      weekList.push({ title: e.title, detail: EVENT_LABEL[e.type] || '', type: 'Event' });
  });

  return { today: todayList, tomorrow: tomorrowList, week: weekList };
}

/* =========================================================
   Local notifications
   ========================================================= */
function notificationsSupported(){
  return typeof Notification !== 'undefined';
}

async function requestNotifyPermission(){
  if(!notificationsSupported()){
    toast('This browser does not support notifications');
    return false;
  }
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied'){
    toast('Notifications blocked — enable in browser settings');
    return false;
  }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}

function showNotification(title, body, tag){
  if(!notificationsSupported() || Notification.permission !== 'granted') return;
  try{
    new Notification(title, {
      body,
      tag: tag || 'turftrack',
      icon: 'icon-192.png',
      badge: 'icon-192.png'
    });
  }catch(e){
    console.warn('Notification failed', e);
  }
}

function checkAndNotify(){
  if(!notificationsSupported() || Notification.permission !== 'granted') return;
  if(!currentUser) return;

  const r = buildReminders();
  const todayStr = todayISO();
  const lastKey = 'tt_last_notify_' + currentUser.uid;
  const lastSent = localStorage.getItem(lastKey);
  if(lastSent === todayStr) return;

  if(r.today.length){
    const body = r.today.length === 1
      ? r.today[0].title
      : `${r.today.length} items due today — tap to open`;
    showNotification('🔔 TurfTrack — Today', body, 'tt_today');
    localStorage.setItem(lastKey, todayStr);
  } else if(r.tomorrow.length){
    const body = r.tomorrow.length === 1
      ? `Tomorrow: ${r.tomorrow[0].title}`
      : `${r.tomorrow.length} items coming tomorrow`;
    showNotification('⏰ TurfTrack — Tomorrow', body, 'tt_tomorrow');
    localStorage.setItem(lastKey, todayStr);
  } else if(r.week.length){
    showNotification('📅 TurfTrack — This Week',
      `${r.week.length} items scheduled this week`, 'tt_week');
    localStorage.setItem(lastKey, todayStr);
  }
}

function startNotifyLoop(){
  if(notifyInterval) return;
  setTimeout(checkAndNotify, 2000);
  notifyInterval = setInterval(checkAndNotify, 30 * 60 * 1000);
}

/* =========================================================
   VIEW: Dashboard
   ========================================================= */
function viewDash(){
  const t = todayISO();
  const todays = state.jobs.filter(j => j.due === t);
  const open = state.jobs.filter(j => j.status !== 'done').length;
  const overdue = state.jobs.filter(j => j.status !== 'done' && j.due && j.due < t).length;
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const repWeek = state.reports.filter(r => r.date >= iso(weekAgo)).length;
  const upcoming = state.events.filter(e => e.date >= t)
    .sort((a,b) => a.date.localeCompare(b.date)).slice(0,6);
  const reminders = buildReminders();

  let html = `
    <div class="stats">
      <div class="stat"><b>${todays.filter(j=>j.status!=='done').length}</b><span>Today</span></div>
      <div class="stat"><b>${open}</b><span>Open</span></div>
      <div class="stat"><b>${repWeek}</b><span>Reports 7d</span></div>
    </div>`;

  if(overdue > 0){
    html += `<div class="card" style="border-left:4px solid var(--red)">
      <h3 style="color:var(--red)">⚠ ${overdue} overdue job${overdue>1?'s':''}</h3>
      <div style="font-size:13.5px;color:#5a6b5c">Check the Jobs tab and reschedule.</div>
    </div>`;
  }

  if(reminders.today.length || reminders.tomorrow.length || reminders.week.length){
    html += `<div class="card" style="border-left:4px solid var(--amber)">
      <h3 style="color:var(--amber)">🔔 Reminders</h3>`;
    if(reminders.today.length){
      html += `<div style="font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px">Today</div>`;
      html += reminders.today.map(r => reminderRow(r, 'p-high')).join('');
    }
    if(reminders.tomorrow.length){
      html += `<div style="font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">Tomorrow</div>`;
      html += reminders.tomorrow.map(r => reminderRow(r, 'p-med')).join('');
    }
    if(reminders.week.length){
      html += `<div style="font-size:12px;font-weight:700;color:var(--green2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">This Week</div>`;
      html += reminders.week.map(r => reminderRow(r, 'p-low')).join('');
    }
    html += `</div>`;
  }

  html += `
    <div class="card">
      <h3>Course Conditions</h3>
      <div class="row2">
        <div class="field" style="margin:0">
          <label>Status</label>
          <select id="dashStatus">
            ${['Open','Closed','Temp Greens','Buggy Ban','Frost Delay','Preferred Lies']
              .map(s => `<option ${state.courseStatus===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>Weather / notes</label>
          <input id="dashWeather" placeholder="e.g. 14°C, light NW" value="${esc(state.weather)}">
        </div>
      </div>
      <button class="submit" style="margin-top:12px;padding:10px;font-size:14px"
        data-action="save-conditions">Save Conditions</button>
    </div>

    <div class="sec-head">
      <h2>Today's Jobs</h2>
      <button class="add-btn" data-action="add-job">+</button>
    </div>
    <div class="card">
      ${todays.length ? todays.map(jobItem).join('')
        : `<div class="empty"><span class="big">🌱</span>No jobs scheduled for today.</div>`}
    </div>

    <div class="sec-head"><h2>Upcoming</h2></div>
    <div class="card">
      ${upcoming.length ? upcoming.map(evItem).join('')
        : `<div class="empty"><span class="big">📅</span>Nothing scheduled ahead.</div>`}
    </div>`;
  return html;
}

function reminderRow(r, cls){
  return `
    <div class="item" style="padding:8px 0">
      <div class="item-body">
        <div class="item-title" style="font-size:13.5px">${esc(r.title)}</div>
        <div class="item-meta">
          <span class="pill ${cls}">${esc(r.type)}</span>
          <span>${esc(r.detail)}</span>
        </div>
      </div>
    </div>`;
}

function viewJobs(){
  const groups = [
    { key:'todo',  label:'To Do' },
    { key:'doing', label:'In Progress' },
    { key:'done',  label:'Completed' }
  ];
  let html = `
    <div class="sec-head">
      <h2>Jobs</h2>
      <button class="add-btn" data-action="add-job">+</button>
    </div>`;
  groups.forEach(g => {
    let list = state.jobs.filter(j => j.status === g.key);
    if(g.key !== 'done') list.sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999'));
    else list = list.slice(-12).reverse();
    html += `<div class="card">
      <h3>${g.label} <span style="color:#b9c7bb">· ${list.length}</span></h3>
      ${list.length ? list.map(jobItem).join('')
        : `<div class="empty" style="padding:12px">Nothing here.</div>`}
    </div>`;
  });
  return html;
}

function jobItem(j){
  const t = todayISO();
  const overdue = j.status !== 'done' && j.due && j.due < t;
  const done = j.status === 'done';
  return `
    <div class="item">
      <div class="tick ${done?'on':''}" data-action="toggle-job" data-id="${j.id}">
        ${done?'✓':''}
      </div>
      <div class="item-body">
        <div class="item-title ${done?'done':''}">${esc(j.title)}</div>
        <div class="item-meta">
          ${j.area ? `<span class="pill p-area">${esc(j.area)}</span>` : ''}
          ${j.type ? `<span class="pill p-type">${esc(j.type)}</span>` : ''}
          ${j.priority ? `<span class="pill p-${j.priority.toLowerCase()}">${esc(j.priority)}</span>` : ''}
          ${overdue ? `<span class="pill p-overdue">Overdue</span>` : ''}
          ${j.due ? `<span>${prettyDate(j.due)}</span>` : ''}
          ${j.assignee ? `<span>· ${esc(j.assignee)}</span>` : ''}
        </div>
        ${j.notes ? `<div class="item-note">${esc(j.notes)}</div>` : ''}
      </div>
      <button class="del" data-action="del-job" data-id="${j.id}" title="Delete">✕</button>
    </div>`;
}

/* =========================================================
   VIEW: Calendar
   ========================================================= */
function viewCalendar(){
  const y = calCursor.getFullYear();
  const m = calCursor.getMonth();
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const monthName = first.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const t = todayISO();

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = iso(new Date(y, m, d));
    const evs = state.events.filter(e => e.date === ds);
    const dots = evs.slice(0,4).map(e => `<span class="dot d-${e.type}"></span>`).join('');
    cells += `
      <div class="cal-day ${ds===t?'today':''} ${ds===selectedDay?'sel':''}"
           data-action="cal-day" data-date="${ds}">
        <span class="num">${d}</span>
        <div class="dots">${dots}</div>
      </div>`;
  }

  let dayPanel = '';
  if(selectedDay){
    const evs = state.events.filter(e => e.date === selectedDay)
      .sort((a,b) => a.title.localeCompare(b.title));
    dayPanel = `
      <div class="card">
        <div class="sec-head" style="margin:0 0 8px">
          <h3 style="margin:0">${prettyDate(selectedDay)}</h3>
          <button class="add-btn" style="width:32px;height:32px;font-size:18px"
            data-action="add-event" data-date="${selectedDay}">+</button>
        </div>
        ${evs.length ? evs.map(evItem).join('')
          : `<div class="empty" style="padding:10px">Nothing on this day.</div>`}
      </div>`;
  }

  const in30 = new Date(); in30.setDate(in30.getDate()+30);
  const upcoming = state.events
    .filter(e => e.date >= t && e.date <= iso(in30))
    .sort((a,b) => a.date.localeCompare(b.date));

  return `
    <div class="sec-head">
      <h2>Calendar</h2>
      <div style="display:flex;gap:6px">
        <button class="add-btn" style="background:var(--blue)" data-action="import-doc" title="Import from photo">📄</button>
        <button class="add-btn" data-action="add-event" data-date="${t}">+</button>
      </div>
    </div>

    <input type="file" id="importDocCamera" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="importDocGallery" accept="image/*" style="display:none">

    <div class="card">
      <div class="cal-head">
        <h2>${monthName}</h2>
        <div class="cal-nav">
          <button data-action="cal-prev">‹</button>
          <button data-action="cal-today">•</button>
          <button data-action="cal-next">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        ${EVENT_TYPES.map(tp =>
          `<span><i class="dot d-${tp}" style="display:inline-block"></i>${EVENT_LABEL[tp]}</span>`
        ).join('')}
      </div>
    </div>

    ${dayPanel}

    <div class="sec-head"><h2>Next 30 Days</h2></div>
    <div class="card">
      ${upcoming.length ? upcoming.map(evItem).join('')
        : `<div class="empty"><span class="big">📅</span>No events in the next 30 days.</div>`}
    </div>`;
}

/* =========================================================
   Image compression
   ========================================================= */
async function compressImage(file, maxSize = 900, quality = 0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxSize){
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if(height > maxSize){
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   Plant ID — photo + AI
   ========================================================= */
async function handlePlantPhoto(inputEl){
  const file = inputEl.files?.[0];
  if(!file) return;

  const todayCount = (state.plantIds||[]).filter(p =>
    (p.created||'').slice(0,10) === todayISO()).length;
  if(todayCount >= 20){
    toast('Daily limit reached (20)');
    inputEl.value = '';
    return;
  }

  try{
    toast('Compressing photo…');
    const dataUrl = await compressImage(file);

    openPlantSheet(dataUrl, null, true);

    const result = await identifyPlant(dataUrl);
    openPlantSheet(dataUrl, result, false);
    inputEl.value = '';
  }catch(e){
    console.error(e);
    openPlantSheet(null, null, false, e.message || 'Unknown error');
    inputEl.value = '';
  }
}

async function identifyPlant(dataUrl){
  const base64 = dataUrl.split(',')[1];

  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [
        { role: 'system', content: PLANT_PROMPT },
        {
          role: 'user',
          content: [
            { type: 'text', text: 'Identify this.' },
            { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64}` } }
          ]
        }
      ]
    })
  });

  if(!res.ok){
    const err = await res.text().catch(() => '');
    throw new Error(`Proxy ${res.status}: ${err.slice(0,120)}`);
  }

  const data = await res.json();
  const raw = data?.choices?.[0]?.message?.content || '';

  const clean = raw.replace(/^```json\s*|\s*```$/g, '').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    console.warn('AI returned non-JSON:', raw);
    throw new Error('AI returned unexpected format');
  }

  return parsed;
}

   Plant Detail Sheet (view + fresh result)
   ========================================================= */
function openPlantSheet(dataUrl, result, loading, errorMsg, plantId){
  const overlay = $('#overlay');
  const sheetForm = $('#sheetForm');

  $('#sheetTitle').textContent = loading ? 'Identifying…' : 'Identification';
  sheetForm.onsubmit = (ev) => ev.preventDefault();

  if(loading){
    sheetForm.innerHTML = `
      <div style="text-align:center;padding:12px 0 24px">
        <img src="${dataUrl}" style="width:100%;max-width:280px;border-radius:14px;margin-bottom:16px;opacity:.85">
        <div style="font-size:38px;margin:8px 0">🔍</div>
        <div style="font-size:14px;color:var(--muted)">Analysing species, symptoms and treatments…</div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">Usually 3–8 seconds</div>
      </div>`;
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    return;
  }

  const plant = plantId ? state.plantIds.find(p => p.id === plantId) : null;

  if(!result && !plant){
    sheetForm.innerHTML = `
      ${dataUrl ? `<img src="${dataUrl}" style="width:100%;border-radius:14px;margin-bottom:16px">` : ''}
      <div class="result" style="border-left-color:var(--red);background:#fdecea">

      </div>
      <button type="button" class="submit" data-action="close-sheet" style="margin-top:12px">Close</button>`;
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    return;
  }

  // Resolve display data
  const d = plant ? {
    name: plant.name,
    botanicalName: plant.botanicalName,
    category: plant.category,
    confidence: plant.confidence,
    description: plant.description,
    action: plant.action,
    products: plant.products,
    safety: plant.safety

  // Resolve photos
  let photos = [];
  if(plant){
    photos = (plant.photos && plant.photos.length) ? plant.photos
           : (plant.thumb ? [plant.thumb] : []);
  } else if(dataUrl){
    photos = [dataUrl];

  const catClass = {
    'Weed': 'p-high', 'Disease': 'p-high', 'Pest': 'p-med',

      <span class="pill ${catClass}">${esc(d.category || 'Unknown')}</span>

    <div style="font-style:italic;color:var(--muted);font-size:13.5px;margin-bottom:14px">
      ${esc(d.botanicalName || 'Unknown')}
    </div>

    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:10px">
      <h3 style="margin-bottom:6px">Description</h3>

    </div>

async function reidentifyPlantAI(photos){
  const content = [
    { type: 'text', text: photos.length > 1
      ? 'Identify this. Multiple photos of the same specimen are attached.'
      : 'Identify this.' },
    ...photos.map(p => ({ type: 'image_url', image_url: { url: p } }))
  ];

  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [
        { role: 'system', content: REIDENTIFY_PROMPT },
        { role: 'user', content }
      ]
    })
  });

  if(!res.ok){
    const err = await res.text().catch(() => '');
    throw new Error(`Proxy ${res.status}: ${err.slice(0,120)}`);
  }

  const data = await res.json();
  const raw = data?.choices?.[0]?.message?.content || '';
  const clean = raw.replace(/^```json\s*|\s*```$/g, '').trim();

  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    console.warn('Re-identify non-JSON:', raw);
    throw new Error('AI returned unexpected format');
  }

  return Array.isArray(parsed.results) ? parsed.results : [];
}

async function handleDocPhoto(inputEl){
  const file = inputEl.files?.[0];
  if(!file) return;

  try{
    toast('Reading document…');
    const dataUrl = await compressImage(file, 1400, 0.8);

    openSheet('Reading document…', `
      <div style="text-align:center;padding:16px 0 24px">
        <img src="${dataUrl}" style="width:100%;max-width:280px;border-radius:14px;margin-bottom:16px;opacity:.85">

        <div style="font-size:12px;color:var(--muted);margin-top:10px">Usually 5–15 seconds</div>
      </div>
    `, () => {});

    const events = await extractEventsFromDoc(dataUrl);
    inputEl.value = '';

    if(!events || !events.length){
      openImportSheet([], dataUrl);
      return;
    }
    openImportSheet(events, dataUrl);
  }catch(e){
    console.error(e);
    inputEl.value = '';
    closeSheet();
    toast('Import failed: ' + (e.message || 'unknown'));
  }
}

async function extractEventsFromDoc(dataUrl){
  const base64 = dataUrl.split(',')[1];

  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [
        { role: 'system', content: getDocExtractPrompt() },
        {
          role: 'user',
          content: [
            { type: 'text', text: 'Extract all events from this document.' },
            { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64}` } }
          ]
        }
      ]
    })
  });

  if(!res.ok){
    const err = await res.text().catch(() => '');
    throw new Error(`Proxy ${res.status}: ${err.slice(0,120)}`);
  }

  const data = await res.json();
  const raw = data?.choices?.[0]?.message?.content || '';

  const clean = raw.replace(/^```json\s*|\s*```$/g, '').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    console.warn('Doc AI returned non-JSON:', raw);
    throw new Error('AI could not read the document');
  }

  const events = Array.isArray(parsed.events) ? parsed.events : [];
  return events.filter(e => e && e.date && e.title);
}

function openImportSheet(events, dataUrl){
  const overlay = $('#overlay');
  const sheetForm = $('#sheetForm');

  $('#sheetTitle').textContent = events.length
    ? `${events.length} event${events.length > 1 ? 's' : ''} found`
    : 'Nothing found';

  sheetForm.onsubmit = (ev) => ev.preventDefault();

  if(!events.length){
    sheetForm.innerHTML = `
      ${dataUrl ? `<img src="${dataUrl}" style="width:100%;border-radius:14px;margin-bottom:16px;opacity:.7">` : ''}
      <div class="result" style="border-left-color:var(--amber);background:#fff8e1">
        <b>Could not find any events.</b><br>
        Try a clearer photo with better lighting, or crop to just the
        schedule section and try again.
      </div>
      <button type="button" class="submit" data-action="close-sheet" style="margin-top:12px">Close</button>`;
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    return;
  }

  window._pendingImport = events.map(e => ({ ...e, _checked: true }));

  sheetForm.innerHTML = `
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">
      Uncheck any events you don't want. Tap <b>Add</b> to save the rest to your calendar.
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:12px;color:var(--muted);font-weight:600">
        <span id="importCount">${events.length}</span> selected
      </span>
      <a style="font-size:12px;color:var(--green);font-weight:700;cursor:pointer;text-decoration:none"
         data-action="import-toggle-all">Toggle all</a>
    </div>

    <div id="importList" style="max-height:50vh;overflow-y:auto;margin-bottom:14px">
      ${events.map((e, i) => importRow(e, i)).join('')}
    </div>

    <button type="button" class="submit" data-action="import-confirm">
      ✅ Add to Calendar
    </button>
    <button type="button" class="submit"
      style="background:#eef3ee;color:var(--text);margin-top:8px"
      data-action="close-sheet">
      Cancel
    </button>
  `;

  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function importRow(e, idx){
  const typeKey = EVENT_TYPES.includes(e.type) ? e.type : 'agronomy';
  return `
    <label class="item" style="padding:9px 0;cursor:pointer;align-items:flex-start">
      <input type="checkbox" data-import-idx="${idx}" checked
        style="width:auto;margin-top:5px;flex:0 0 auto"
        onchange="window._onImportToggle(${idx}, this.checked)">
      <div class="item-body">
        <div class="item-title" style="font-size:13.5px">${esc(e.title)}</div>
        <div class="item-meta">
          <span class="pill p-type">${EVENT_LABEL[typeKey]}</span>
          <span>${prettyDate(e.date)}</span>
        </div>
        ${e.notes ? `<div class="item-note" style="font-size:12px">${esc(e.notes)}</div>` : ''}
      </div>
    </label>`;
}

window._onImportToggle = function(idx, checked){
  if(!window._pendingImport || !window._pendingImport[idx]) return;
  window._pendingImport[idx]._checked = checked;
  const c = $('#importCount');
  if(c) c.textContent = window._pendingImport.filter(e => e._checked).length;
};

/* =========================================================

   ========================================================= */
const overlay = $('#overlay');
const sheetForm = $('#sheetForm');

function openSheet(title, fieldsHtml, onSubmit){
  $('#sheetTitle').textContent = title;
  sheetForm.innerHTML = fieldsHtml +
    `<button type="submit" class="submit">Save</button>`;
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  sheetForm.onsubmit = async (ev) => {
    ev.preventDefault();
    const data = {};
    new FormData(sheetForm).forEach((v,k) => data[k] = v);
    await onSubmit(data);
    closeSheet();
    render();
  };
}
function closeSheet(){
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}
$('#sheetClose').addEventListener('click', closeSheet);
overlay.addEventListener('click', e => { if(e.target === overlay) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

function optList(arr, sel){
  return arr.map(o => `<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
}

/* =========================================================
   Actions
   ========================================================= */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;

  switch(a){

    case 'nav':
      activeTab = el.dataset.tab;
      closeSheet();
      render();
      break;

    case 'save-conditions':
      state.courseStatus = $('#dashStatus').value;
      state.weather = $('#dashWeather').value.trim();
      await fsSaveSettings();
      toast('Conditions updated');
      break;

    case 'add-job': formJob(); break;

    case 'toggle-job': {
      const j = state.jobs.find(x => x.id === id);
      if(!j) return;
      j.status = j.status === 'done' ? 'todo'
               : j.status === 'todo'  ? 'doing'
               : 'done';
      render();
      await fsSave('jobs', j);
      break;
    }

    case 'del-job':
      state.jobs = state.jobs.filter(x => x.id !== id);
      render();
      await fsDelete('jobs', id);
      toast('Job deleted');
      break;

    case 'add-report': formReport(); break;

    case 'del-report':
      state.reports = state.reports.filter(x => x.id !== id);
      render();
      await fsDelete('reports', id);
      toast('Report deleted');
      break;

    case 'cal-prev': calCursor.setMonth(calCursor.getMonth()-1); render(); break;
    case 'cal-next': calCursor.setMonth(calCursor.getMonth()+1); render(); break;
    case 'cal-today': calCursor = new Date(); selectedDay = todayISO(); render(); break;
    case 'cal-day':
      selectedDay = (selectedDay === el.dataset.date) ? null : el.dataset.date;
      render();
      break;

    case 'add-event': formEvent(el.dataset.date); break;

    case 'toggle-event': {
      const ev = state.events.find(x => x.id === id);
      if(!ev) return;
      ev.done = !ev.done;
      render();
      await fsSave('events', ev);
      break;
    }

    case 'del-event':
      state.events = state.events.filter(x => x.id !== id);
      render();
      await fsDelete('events', id);
      toast('Event deleted');
      break;

    /* ---- Document Import ---- */
    case 'import-doc':
      openSheet('Import from document', `
        <p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">
          Take a photo of a yearly program, tournament list, renovation schedule
          or chemical plan. AI will read it and extract the events.
        </p>
        <button type="button" class="submit" data-action="import-camera"
          style="padding:14px;font-size:15px;margin-bottom:8px">
          📷 Take Photo
        </button>
        <button type="button" class="submit"
          style="background:#fff;color:var(--green);border:1.5px solid var(--green);padding:13px;font-size:14px"
          data-action="import-gallery">
          🖼 Choose from Gallery
        </button>
      `, () => {});
      break;

    case 'import-camera':
      closeSheet();
      setTimeout(() => $('#importDocCamera')?.click(), 150);
      break;

    case 'import-gallery':
      closeSheet();
      setTimeout(() => $('#importDocGallery')?.click(), 150);
      break;

    case 'import-toggle-all': {
      const all = window._pendingImport || [];
      const anyChecked = all.some(e => e._checked);
      all.forEach(e => e._checked = !anyChecked);
      const list = $('#importList');
      if(list) list.innerHTML = all.map((e, i) => importRow(e, i)).join('');
      const c = $('#importCount');
      if(c) c.textContent = all.filter(e => e._checked).length;
      break;
    }

    case 'import-confirm': {
      const all = window._pendingImport || [];
      const toAdd = all.filter(e => e._checked);
      if(!toAdd.length){
        toast('Nothing selected');
        break;
      }
      closeSheet();
      setSyncStatus('⏳ Saving');
      for(const e of toAdd){
        const ev = {
          id: uid('e'),
          title: e.title.trim(),
          date: e.date,
          type: EVENT_TYPES.includes(e.type) ? e.type : 'agronomy',
          notes: (e.notes || '').trim(),
          done: false
        };
        state.events.push(ev);
        await fsSave('events', ev);
      }
      setSyncStatus('☁️ Synced');
      window._pendingImport = null;
      activeTab = 'calendar';
      render();
      toast(`Added ${toAdd.length} event${toAdd.length>1?'s':''}`);
      break;
    }

    case 'toggle-program': {
      const mId = el.dataset.month;
      const wkNum = parseInt(el.dataset.week);
      const itemId = el.dataset.item;
      const month = state.program.find(m => m.id === mId);
      if(!month) return;
      const week = (month.weeks || []).find(w => w.week === wkNum);
      if(!week) return;
      const item = (week.items || []).find(i => i.id === itemId);
      if(!item) return;
      item.done = !item.done;
      render();
      await fsSave('program', month);
      break;
    }

    /* ---- Plant ID ---- */
    case 'plant-camera':
      $('#plantInputCamera').click();
      break;

    case 'plant-gallery':
      $('#plantInputGallery').click();
      break;

    case 'close-sheet':
      closeSheet();
      break;

    case 'view-plant': {
      const p = state.plantIds.find(x => x.id === id);
      if(!p) return;
      openPlantSheet(null, null, false, null, p.id);
      break;
    }

    case 'plant-filter':
      plantFilter = el.dataset.filter;
      render();
      break;

    case 'view-photo':
      e.stopPropagation();
      $('#photoViewerImg').src = el.dataset.src;
      $('#photoViewer').classList.remove('hidden');
      break;

    case 'close-photo-viewer':
      $('#photoViewer').classList.add('hidden');
      break;

    case 'save-plant': {
      const dataEl = $('#plantSaveData');
      if(!dataEl) return;
      const result = JSON.parse(dataEl.textContent);
      const photo = _plantPhotoData;

      const plantRec = {
        id: uid('pl'),
        name: result.name || 'Unknown',
        botanicalName: result.botanicalName || 'Unknown',
        category: result.category || 'Unknown',
        confidence: result.confidence || 0,
        description: result.description || '',
        action: result.action || '',
        products: result.products || '',
        safety: result.safety || '',
        photos: photo ? [photo] : [],
        thumb: photo || null,
        created: new Date().toISOString()
      };

      state.plantIds.push(plantRec);
      await fsSave('plantIds', plantRec);

      const learnRec = {
        id: uid('l'),
        topic: `${plantRec.name} (${plantRec.category})`,
        date: todayISO(),
        category: 'Agronomy',
        hours: '',
        supervisor: '',
        notes: `${plantRec.botanicalName}\n\n${plantRec.description}\n\nAction: ${plantRec.action}`
      };
      state.learn.push(learnRec);
      await fsSave('learn', learnRec);

      closeSheet();
      activeTab = 'plant';
      render();
      toast('Saved to Plant ID & Journal');
      break;
    }

    case 'delete-plant-detail':
      if(!confirm('Delete this plant? This also deletes its chat history.')) break;
      state.plantIds = state.plantIds.filter(x => x.id !== id);
      state.plantChats = state.plantChats.filter(c => c.plantId !== id);
      closeSheet();
      render();
      await fsDelete('plantIds', id);
      toast('Plant deleted');
      break;

    /* ---- Plant Edit ---- */
    case 'edit-plant':
      openPlantEditForm(id);
      break;

    case 'edit-add-camera':
      $('#editPhotoCamera')?.click();
      break;

    case 'edit-add-gallery':
      $('#editPhotoGallery')?.click();
      break;

    case 'edit-remove-photo':
      window._editPhotos = window._editPhotos || [];
      window._editPhotos.splice(parseInt(el.dataset.idx), 1);
      refreshEditPhotoStrip();
      break;

    case 'edit-save-plant': {
      const plant = state.plantIds.find(p => p.id === id);
      if(!plant) break;

      const form = $('#sheetForm');
      const fd = new FormData(form);
      const d = {};
      fd.forEach((v, k) => d[k] = v);

      plant.name = (d.name || '').trim() || 'Unknown';
      plant.botanicalName = (d.botanicalName || '').trim() || 'Unknown';
      plant.category = d.category || 'Unknown';
      plant.confidence = parseInt(d.confidence) || 0;
      plant.description = (d.description || '').trim();
      plant.action = (d.action || '').trim();
      plant.products = (d.products || '').trim();
      plant.safety = (d.safety || '').trim();
      plant.photos = window._editPhotos || [];
      plant.thumb = plant.photos[0] || null;

      await fsSave('plantIds', plant);
      window._editPhotos = null;
      openPlantSheet(null, null, false, null, plant.id);
      toast('Saved');
      break;
    }

    /* ---- Re-identify ---- */
    case 'reidentify-plant':
      await reidentifyPlant(id);
      break;

    case 'apply-reidentify': {
      const plant = state.plantIds.find(p => p.id === id);
      const idx = parseInt(el.dataset.idx);
      const dataEl = $('#reidentifyData');
      if(!plant || !dataEl) break;
      const results = JSON.parse(dataEl.textContent);
      const r = results[idx];
      if(!r) break;

      plant.name = r.name || 'Unknown';
      plant.botanicalName = r.botanicalName || 'Unknown';
      plant.category = r.category || 'Unknown';
      plant.confidence = r.confidence || 0;
      plant.description = r.description || '';
      plant.action = r.action || '';
      plant.products = r.products || '';
      plant.safety = r.safety || '';

      await fsSave('plantIds', plant);
      openPlantSheet(null, null, false, null, plant.id);
      toast('Applied');
      break;
    }

    /* ---- Plant Chat ---- */
    case 'ask-plant':
      await openPlantChat(id);
      break;

    case 'chat-send': {
      const plantId = el.dataset.plant;
      const input = $('#chatInput');
      if(!input) break;
      const text = input.value.trim();
      if(!text) break;

      const plant = state.plantIds.find(p => p.id === plantId);
      const chat  = state.plantChats.find(c => c.plantId === plantId);
      if(!plant || !chat) break;

      input.disabled = true;
      input.value = '';

      chat.messages.push({ role: 'user', content: text, ts: Date.now() });

      const msgsEl = $('#chatMessages');
      if(msgsEl){
        msgsEl.innerHTML += chatBubble({ role: 'user', content: text });
        msgsEl.innerHTML += `<div id="typingIndicator" style="display:flex;justify-content:flex-start;margin-bottom:9px">
          <div style="padding:9px 13px;border-radius:15px;background:#eef3ee;color:var(--muted);font-size:13px;font-style:italic">
            Thinking…
          </div>
        </div>`;
        scrollChatBottom();
      }

      try{
        const reply = await askAboutPlant(plant, chat.messages);
        chat.messages.push({ role: 'assistant', content: reply, ts: Date.now() });
        await fsSave('plantChats', chat);
        renderPlantChat(plant, chat);
      }catch(err){
        console.error(err);
        const ti = $('#typingIndicator');
        if(ti) ti.remove();
        if(msgsEl){
          msgsEl.innerHTML += `<div style="text-align:center;color:var(--red);font-size:12.5px;padding:8px">
            ⚠ ${esc(err.message || 'Failed to get response')}
          </div>`;
          scrollChatBottom();
        }
        if(input) input.disabled = false;
        await fsSave('plantChats', chat);
      }
      break;
    }

    /* ---- Learn ---- */
    case 'add-learn': formLearn(); break;

    case 'del-learn':
      state.learn = state.learn.filter(x => x.id !== id);
      render();
      await fsDelete('learn', id);
      toast('Entry deleted');
      break;

    /* ---- Calculators ---- */
    case 'calc-spray': {
      const area = parseFloat($('#cArea').value) || 0;
      const rate = parseFloat($('#cRate').value) || 0;
      const vol  = parseFloat($('#cVol').value)  || 0;
      const tank = parseFloat($('#cTank').value) || 0;
      if(!area){ toast('Enter an area'); break; }
      const units = area / 100;
      const product = units * rate;
      const water   = units * vol;
      const tanks   = tank > 0 ? (water / tank) : 0;
      $('#cSprayOut').innerHTML = `<div class="result">
        Product needed: <b>${product.toFixed(2)}</b> (match your rate unit)<br>
        Water needed: <b>${water.toFixed(1)} L</b><br>
        ${tank > 0 ? `Tank fills: <b>${tanks.toFixed(2)}</b> (${Math.ceil(tanks)} loads of ${tank} L)<br>` : ''}
        <span style="font-size:12px;color:var(--muted)">Always double-check against the product label.</span>
      </div>`;
      break;
    }

    case 'calc-fert': {
      const area = parseFloat($('#fArea').value) || 0;
      const n    = parseFloat($('#fN').value)    || 0;
      const pct  = parseFloat($('#fPct').value)  || 0;
      if(!area || !n || !pct){ toast('Fill in all three fields'); break; }
      const totalN   = area * n;
      const productG = totalN / (pct / 100);
      $('#cFertOut').innerHTML = `<div class="result">
        Total N required: <b>${(totalN/1000).toFixed(2)} kg</b><br>
        Product required: <b>${(productG/1000).toFixed(2)} kg</b>
        <span style="font-size:12px;color:var(--muted)">(${productG.toFixed(0)} g)</span><br>
        <span style="font-size:12px;color:var(--muted)">Always double-check against the product label.</span>
      </div>`;
      break;
    }

    case 'calc-area': {
      const L = parseFloat($('#aLen').value) || 0;
      const W = parseFloat($('#aWid').value) || 0;
      if(!L || !W){ toast('Enter length and width'); break; }
      const area = L * W;
      $('#cAreaOut').innerHTML = `<div class="result">
        Area: <b>${area.toFixed(1)} m²</b><br>
        = <b>${(area/100).toFixed(2)}</b> × 100 m² units<br>
        = <b>${(area/10000).toFixed(4)} ha</b>
      </div>`;
      break;
    }

    case 'menu': formData(); break;

    case 'enable-notifications': {
      const ok = await requestNotifyPermission();
      if(ok){
        toast('Notifications enabled 🎉');
        if(currentUser) localStorage.removeItem('tt_last_notify_' + currentUser.uid);
        checkAndNotify();
        formData();
      } else {
        toast('Permission not granted');
      }
      break;
    }

    case 'test-notification': {
      const ok = await requestNotifyPermission();
      if(ok){
        showNotification(
          '⛳ TurfTrack test',
          'If you can see this, notifications are working!',
          'tt_test_' + Date.now()
        );
      }
      break;
    }

    case 'signout':
      closeSheet();
      await signOut(auth);
      break;

    case 'wipe': {
      if(!confirm('Delete ALL your data from the cloud and this device? This cannot be undone.')){
        break;
      }
      closeSheet();
      setSyncStatus('⏳ Deleting');
      const u = userPath();
      const subs = ['jobs','reports','events','learn','program','plantIds','plantChats'];
      for(const sub of subs){
        const snap = await getDocs(collection(db, 'users', u, sub));
        for(const d of snap.docs){
          try{ await deleteDoc(d.ref); }catch(e){ console.warn(e); }
        }
      }
      state = { jobs:[], reports:[], events:[], learn:[], program:[], plantIds:[], plantChats:[],
                weather:'', courseStatus:'Open' };
      setSyncStatus('☁️ Synced');
      render();
      toast('All data deleted');
      break;
    }
  }
});

/* =========================================================
   File input handlers
   ========================================================= */
document.addEventListener('change', (e) => {
  if(e.target.id === 'plantInputCamera' || e.target.id === 'plantInputGallery'){
    handlePlantPhoto(e.target);
  }
  if(e.target.id === 'importDocCamera' || e.target.id === 'importDocGallery'){
    handleDocPhoto(e.target);
  }
  if(e.target.id === 'editPhotoCamera' || e.target.id === 'editPhotoGallery'){
    handleEditPhoto(e.target);
  }
});

/* =========================================================
   Visibility — check reminders on return
   ========================================================= */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && currentUser){
    checkAndNotify();
  }
});
</script>
